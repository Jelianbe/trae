<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; max-width: 600px; margin: 0 auto; background: #1a1a1e; color: #e8e4df; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; }
        input[type="file"] { padding: 10px; background: #2c2c33; border: 1px solid #3a3a44; border-radius: 8px; color: #e8e4df; }
        button { padding: 12px 24px; background: #e8e4df; color: #1a1a1e; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #f5f2ed; }
        .result { margin-top: 20px; padding: 16px; background: #2c2c33; border-radius: 8px; }
        .success { color: #7ec89b; }
        .error { color: #d4727a; }
    </style>
</head>
<body>
    <h1>上传测试</h1>
    
    <div class="form-group">
        <label for="file-input">选择 TXT 文件:</label>
        <input type="file" id="file-input" accept=".txt">
    </div>
    
    <button onclick="uploadFile()">上传文件</button>
    
    <div class="result" id="result" style="display:none"></div>

    <script>
        async function uploadFile() {
            const input = document.getElementById('file-input');
            const result = document.getElementById('result');
            
            if (!input.files || input.files.length === 0) {
                result.textContent = '请选择文件';
                result.className = 'result error';
                result.style.display = 'block';
                return;
            }
            
            const file = input.files[0];
            const fd = new FormData();
            fd.append('file', file);
            
            try {
                result.textContent = '上传中...';
                result.className = 'result';
                result.style.display = 'block';
                
                const response = await fetch('/api/v1/projects/upload', {
                    method: 'POST',
                    body: fd
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.textContent = JSON.stringify(data, null, 2);
                    result.className = 'result success';
                } else {
                    result.textContent = '错误: ' + (data.detail || data.error || '未知错误');
                    result.className = 'result error';
                }
            } catch (error) {
                result.textContent = '请求失败: ' + error.message;
                result.className = 'result error';
            }
        }
    </script>
</body>
</html>
